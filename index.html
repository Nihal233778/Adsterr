
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Miner - Tap & Earn</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 background:#101827;color:white;
 text-align:center
}
h2{color:#ffd34e}
.card{
 background:#202c40;
 padding:22px;border-radius:20px;
 margin:18px 0
}
.balance{font-size:48px;color:#ffd34e}
button{
 border:0;border-radius:14px;
 padding:16px 24px;
 font-size:17px;font-weight:bold;
 cursor:pointer;margin:8px
}
#tap{background:#168de0;color:white;
 width:220px;height:220px;border-radius:50%;
 font-size:27px}
#watch{background:#f6b934;color:#171717}
#status{color:#ffd34e;min-height:25px}
.banner{
 background:#202c40;border:1px dashed #64748b;
 border-radius:14px;padding:18px;
 min-height:100px;margin:18px 0
}
</style>
</head>

<body>

<h2>⚡ Gold Miner</h2>
<div class="card">
 <p>YOUR BALANCE</p>
 <div class="balance" id="balance">0</div>
 <p>⚡ Energy: <span id="energy">100</span>/100</p>
</div>

<button id="tap">🪙 TAP!</button>

<div class="card">
 <h3>🎬 Watch an Ad</h3>
 <p>Watch a video to earn 10 coins.</p>
 <button id="watch">Watch Rewarded Ad</button>
 <p id="status">Rewarded ads not configured yet.</p>
</div>

<h3>📢 Advertisement</h3>
<div class="banner" id="sota-banner">
 Sota Ads banner placement
</div>

<div class="card">
 <h3>🛒 Upgrades</h3>
 <button onclick="upgrade()">Power Boost - 50 coins</button>
 <p>Power: <span id="power">1</span></p>
</div>

<script>
// Telegram initialization
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

// Game data
let balance = Number(localStorage.getItem("balance")) || 0;
let energy = 100;
let power = 1;

function save(){
 localStorage.setItem("balance",balance);
}

function update(){
 document.getElementById("balance").textContent=balance;
 document.getElementById("energy").textContent=energy;
 document.getElementById("power").textContent=power;
}

document.getElementById("tap").onclick=()=>{
 if(energy < 1) return;
 balance += power;
 energy--;
 save();
 update();
};

function upgrade(){
 if(balance < 50) return;
 balance-=50;
 power++;
 save();
 update();
}

setInterval(()=>{
 if(energy < 100){
  energy++;
  update();
 }
},1000);

// SOTA ADS BANNER INTEGRATION
// Paste the exact two Sota script tags from
// your dashboard above this script.
//
// Then initialize using the generated integration
// configuration and your newly issued token.
//
// Example initialization shown in Sota docs:
//
// SotaAds.init({
//   token: "YOUR_NEW_INTEGRATION_TOKEN",
//   api: "https://adsota.io",
//   auto: true
// });
//
// Do not guess SDK script URLs.

// REWARDED VIDEO
// No verified rewarded-video method or completion
// callback was available in the supplied documentation.
// Therefore, do not award coins or pretend an ad played.

document.getElementById("watch").onclick=()=>{
 document.getElementById("status").textContent=
 "Rewarded video integration is not configured. Please check Sota Ads support.";
};

update();
</script>

</body>
</html>
